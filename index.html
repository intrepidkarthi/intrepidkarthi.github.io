<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>∴</title>
<meta name="description" content="the rest is left as an exercise.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="∴">
<meta property="og:description" content="the rest is left as an exercise.">
<style>
  :root { --ink: #e8ecf4; --dim: #6b7280; --line: rgba(232,236,244,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #05060a;
    color: var(--ink);
    font: 400 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* abstract flow-field behind everything */
  #f { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* subtle vignette + faint horizontal "ladder" scan, evoking a depth of levels */
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(232,236,244,.018) 38px 39px),
      radial-gradient(120% 90% at 50% 45%, transparent 55%, #05060a 100%);
  }
  main {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    opacity: 0; animation: rise 1.6s cubic-bezier(.22,.61,.36,1) .2s forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .sigil { width: 92px; height: 92px; margin-bottom: 30px; opacity: .9; }
  .sigil circle { fill: none; stroke: var(--ink); }
  .ring-a { stroke-opacity: .22; }
  .ring-b { stroke-opacity: .5; stroke-dasharray: 3 7; transform-origin: 50% 50%; animation: spin 26s linear infinite; }
  .ring-c { stroke-opacity: .3; stroke-dasharray: 1 12; transform-origin: 50% 50%; animation: spin 60s linear infinite reverse; }
  .dot { fill: var(--ink); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .whisper {
    color: var(--dim);
    font-size: clamp(13px, 2.6vw, 15px);
    letter-spacing: .06em;
    max-width: 30ch;
  }

  nav { margin-top: 42px; display: flex; gap: 34px; flex-wrap: wrap; justify-content: center; }
  a.link {
    position: relative; color: var(--ink); text-decoration: none;
    font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    padding-bottom: 4px; opacity: .82; transition: opacity .3s ease;
  }
  a.link .arw { color: var(--dim); transition: transform .3s ease, color .3s ease; display: inline-block; }
  a.link::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
    background: var(--line); transform: scaleX(0); transform-origin: left;
    transition: transform .4s cubic-bezier(.22,.61,.36,1), background .3s ease;
  }
  a.link:hover { opacity: 1; }
  a.link:hover::after { transform: scaleX(1); background: var(--ink); }
  a.link:hover .arw { transform: translate(2px,-2px); color: var(--ink); }
  a.link:focus-visible { outline: 1px solid var(--line); outline-offset: 6px; border-radius: 2px; }

  footer { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; z-index: 2; }
  footer span { color: #2a2f3a; font-size: 11px; letter-spacing: .3em; }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; opacity: 1; }
    .ring-b, .ring-c { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="f" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main>
    <svg class="sigil" viewBox="0 0 100 100" role="img" aria-label="mark">
      <circle class="ring-a" cx="50" cy="50" r="46" stroke-width="1"/>
      <circle class="ring-b" cx="50" cy="50" r="34" stroke-width="1"/>
      <circle class="ring-c" cx="50" cy="50" r="22" stroke-width="1"/>
      <circle class="dot" cx="50" cy="50" r="1.6"/>
    </svg>

    <p class="whisper">the rest is left as an exercise.</p>

    <nav>
      <a class="link" href="https://github.com/intrepidkarthi/orderbook" rel="noopener">orderbook <span class="arw">&#8599;</span></a>
      <a class="link" href="https://getdailyvox.com" rel="noopener">dailyvox <span class="arw">&#8599;</span></a>
      <a class="link" href="https://intrepidkarthi.com" rel="noopener">intrepidkarthi.com <span class="arw">&#8599;</span></a>
    </nav>
  </main>

  <footer><span>&#8756;</span></footer>

<script>
(function () {
  var canvas = document.getElementById('f'), ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, pts, t = 0, raf;
  var N = 150;

  function resize() {
    w = canvas.width = Math.floor(innerWidth * dpr);
    h = canvas.height = Math.floor(innerHeight * dpr);
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, w, h);
  }

  function seed() {
    pts = [];
    for (var i = 0; i < N; i++) {
      pts.push({ x: Math.random() * w, y: Math.random() * h, s: 0.4 + Math.random() * 0.9 });
    }
  }

  // cheap smooth flow field (no external noise lib): an angle per position/time
  function angle(x, y, tt) {
    return (Math.sin(x * 0.0016 + tt) + Math.cos(y * 0.0019 - tt * 0.7)) * Math.PI;
  }

  function step() {
    // faint trails: veil the previous frame instead of clearing it
    ctx.fillStyle = 'rgba(5,6,10,0.10)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(198,208,228,0.42)';
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var a = angle(p.x, p.y, t);
      p.x += Math.cos(a) * p.s * dpr;
      p.y += Math.sin(a) * p.s * dpr;
      if (p.x < 0) p.x += w; else if (p.x > w) p.x -= w;
      if (p.y < 0) p.y += h; else if (p.y > h) p.y -= h;
      ctx.fillRect(p.x, p.y, dpr, dpr);
    }
    t += 0.0016;
    raf = requestAnimationFrame(step);
  }

  function start() {
    resize(); seed();
    if (reduce) {
      ctx.fillStyle = 'rgba(198,208,228,0.30)';
      for (var i = 0; i < pts.length; i++) ctx.fillRect(pts[i].x, pts[i].y, dpr, dpr);
      return;
    }
    cancelAnimationFrame(raf); step();
  }

  var to;
  window.addEventListener('resize', function () { clearTimeout(to); to = setTimeout(start, 180); });
  start();
})();
</script>
</body>
</html>
